name: Release

# Builds release bundles for Windows / Linux / macOS / Android and attaches
# them to a GitHub Release. Triggered by pushing a tag like `v1.0.0`:
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# Each platform job builds the FFmpeg bridge for its target (and on Windows
# swaps in the full lavfi-capable libmpv), then uploads its bundle as an
# artifact; the `release` job collects everything into the GitHub Release.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true

      # MinGW-w64 gcc is needed to compile ffmpeg_bridge.dll.
      - name: Install MinGW
        run: choco install mingw -y --no-progress

      # Fetches FFmpeg DLLs, compiles the bridge, builds with Flutter, swaps
      # in the full libmpv and zips dist/asmr_hub-windows-x64.zip.
      - name: Build Windows bundle
        shell: pwsh
        run: ./tool/build_windows.ps1 -Release

      - uses: actions/upload-artifact@v4
        with:
          name: asmr_hub-windows-x64
          path: dist/asmr_hub-windows-x64.zip
          retention-days: 14

  linux:
    name: Linux x64
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libstdc++-13-dev \
            libavformat-dev libavcodec-dev libavutil-dev libswresample-dev \
            libmpv-dev libayatana-appindicator3-dev

      # Bridge + flutter build + bundle system libmpv + tar.gz.
      - name: Build Linux bundle
        run: bash tool/build_linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: asmr_hub-linux-x64
          path: dist/asmr_hub-linux-x64.tar.gz
          retention-days: 14

  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-13
            arch: x64
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Install FFmpeg (Homebrew)
        run: brew install ffmpeg

      # Bridge + flutter build + bundle FFmpeg dylibs + zip.
      - name: Build macOS bundle
        run: bash tool/build_macos.sh

      - uses: actions/upload-artifact@v4
        with:
          name: asmr_hub-macos-${{ matrix.arch }}
          path: dist/asmr_hub-macos-${{ matrix.arch }}.zip
          retention-days: 14

  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      # The Gradle wrapper downloads the distribution itself; prefer IPv4 to
      # avoid "Connection refused" hiccups on the CI runner.
      GRADLE_OPTS: -Djava.net.preferIPv4Stack=true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true

      - uses: android-actions/setup-android@v3

      # flutter.ndkVersion for Flutter 3.47 (see gradle_utils.dart).
      - name: Install NDK
        run: sdkmanager "ndk;28.2.13676358"

      # The Gradle wrapper downloads its distribution itself and has failed
      # with "Connection refused" to services.gradle.org from this runner.
      # Pre-seed the wrapper cache with curl (multi-mirror fallback) so
      # gradlew finds a complete, verified distribution and never downloads.
      - name: Pre-seed Gradle distribution
        run: |
          set -euo pipefail
          DIST_NAME="gradle-8.14-all"
          URLS=(
            "https://services.gradle.org/distributions/gradle-8.14-all.zip"
            "https://mirrors.cloud.tencent.com/gradle/gradle-8.14-all.zip"
            "https://mirrors.huaweicloud.com/gradle/gradle-8.14-all.zip"
          )
          GRADLE_USER_HOME="${GRADLE_USER_HOME:-$HOME/.gradle}"
          # Wrapper cache subdir: <dist-name>/<base36(md5(url))> (see Gradle's
          # PathAssembler). The md5 must match the OFFICIAL url exactly.
          HASH36="$(python3 -c "import hashlib
          def to36(n):
              d='0123456789abcdefghijklmnopqrstuvwxyz'
              s=''
              while n:
                  n,r=divmod(n,36); s=d[r]+s
              return s
          print(to36(int.from_bytes(hashlib.md5(b'${URLS[0]}').digest(),'big')))")"
          DIST_DIR="$GRADLE_USER_HOME/wrapper/dists/$DIST_NAME/$HASH36"
          ZIP="$DIST_DIR/$DIST_NAME.zip"
          mkdir -p "$DIST_DIR"
          if [ ! -f "$ZIP" ]; then
            for url in "${URLS[@]}"; do
              echo "Downloading Gradle distribution via curl: $url"
              if curl -fL --connect-timeout 30 --retry 3 --retry-all-errors \
                  -o "$ZIP.part" "$url"; then
                mv "$ZIP.part" "$ZIP"
                break
              fi
              rm -f "$ZIP.part"
            done
            [ -f "$ZIP" ] || { echo "ERROR: could not download Gradle distribution from any mirror" >&2; exit 1; }
          fi
          unzip -q -o "$ZIP" -d "$DIST_DIR"
          # Marker consumed by org.gradle.wrapper.Install.
          touch "$DIST_DIR/$DIST_NAME.zip.ok"
          echo "Gradle distribution pre-seeded at $DIST_DIR"

      # FFmpeg (jniLibs) + flutter build apk + copy into dist/.
      - name: Build APK
        run: bash tool/build_android.sh

      - uses: actions/upload-artifact@v4
        with:
          name: asmr_hub-android
          path: dist/asmr_hub-android.apk
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: [windows, linux, macos, android]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          fail_on_unmatched_files: true
