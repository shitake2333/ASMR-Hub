org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# NOTE: proxy settings are machine-specific and must NOT live in this repo
# (they break CI builds — the runner has no local proxy). If your machine
# needs a proxy for Android builds, put it in your USER-level
# ~/.gradle/gradle.properties instead, e.g.:
#   systemProp.http.proxyHost=127.0.0.1
#   systemProp.http.proxyPort=4780
#   systemProp.https.proxyHost=127.0.0.1
#   systemProp.https.proxyPort=4780

# 使用国内镜像源
org.gradle.parallel=true
org.gradle.daemon=true
org.gradle.configureondemand=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
