distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
# 8.14.3 (not 8.14.0) bundles the kotlin-dsl 5.2.0 plugin that Flutter 3.47's
# flutter_tools gradle plugin resolves; 8.14.0 fails with "kotlin-dsl 5.2.0
# was not found" on CI.
distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.3-all.zip
# The default 10 s timeout is too short for the (large) distribution download
# on slow CI egress.
networkTimeout=60000
